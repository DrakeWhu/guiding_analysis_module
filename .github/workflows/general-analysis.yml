name: General analysis validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: Check Python syntax
        run: python -m compileall -q cap_guiding laser_guiding scripts tests
      - name: Run complete legacy and general analysis suite
        run: PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check standalone command
        run: python -B scripts/visualize_case.py --help
